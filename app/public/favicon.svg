<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="3" fill="#080A07"/>
  <!-- > prompt — dimmed left -->
  <polyline points="3,11 8,16 3,21" fill="none" stroke="#5C3E04" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- A legs as single path — apex is a join, no overshoot -->
  <polyline points="13,23 18,10 23,23" fill="none" stroke="#C8890A" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Crossbar -->
  <line x1="15" y1="19" x2="21" y2="19" stroke="#C8890A" stroke-width="1.8" stroke-linecap="square"/>
  <!-- Underscore -->
  <line x1="13" y1="26" x2="23" y2="26" stroke="#C8890A" stroke-width="1.5" stroke-linecap="square"/>
</svg>
