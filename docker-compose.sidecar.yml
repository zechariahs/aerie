# docker-compose.sidecar.yml
#
# Aerie sidecar for the OpenClaw stack.
#
# Usage:
#   docker compose \
#     -f /path/to/openclaw/docker-compose.yml \
#     -f /path/to/aerie/docker-compose.sidecar.yml \
#     up -d
#
# Or add an include: directive to the main docker-compose.yml.

services:
  aerie:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: aerie:latest
    container_name: aerie
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      # OpenClaw data — READ ONLY. Never write to this mount.
      - ${OPENCLAW_DATA_PATH}:/openclaw:ro
      # Aerie's own persistent data (tasks, audit log, brief history)
      - aerie_data:/app/data
    env_file:
      - ./app/.env.production
    environment:
      - NODE_ENV=production
      - OPENCLAW_DIR=/openclaw
      - OPENCLAW_GATEWAY_URL=${OPENCLAW_GATEWAY_URL}
      # HOST_AGENT_URL uses host.docker.internal to reach the host-level agent
      - HOST_AGENT_URL=http://host.docker.internal:3101
    networks:
      - openclaw_network
    extra_hosts:
      # Required for host.docker.internal on Linux
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  aerie_data:
    name: aerie_data

networks:
  openclaw_network:
    external: true
    name: ${OPENCLAW_NETWORK_NAME}
