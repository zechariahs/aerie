# docker-compose.sidecar.yml
#
# Mission Control sidecar for openclaw-v5t3 stack.
#
# Usage:
#   docker compose \
#     -f /docker/openclaw-v5t3/docker-compose.yml \
#     -f /docker/openclaw-v5t3/mission-control/docker-compose.sidecar.yml \
#     up -d
#
# Or add an include: directive to the main docker-compose.yml.

services:
  mission-control:
    build:
      context: ./mission-control
      dockerfile: Dockerfile
    image: mc-wintermute:latest
    container_name: mc-wintermute
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      # OpenClaw data — READ ONLY. Never write to this mount.
      - /docker/openclaw-v5t3/data/.openclaw:/openclaw:ro
      # Mission Control's own persistent data (tasks, audit log, brief history)
      - mc_data:/app/data
    env_file:
      - ./mission-control/.env.production
    environment:
      - NODE_ENV=production
      - OPENCLAW_DIR=/openclaw
      - OPENCLAW_GATEWAY_URL=ws://openclaw-v5t3-openclaw-1:18789
      # HOST_AGENT_URL uses host.docker.internal to reach the host-level agent
      - HOST_AGENT_URL=http://host.docker.internal:3101
    networks:
      - openclaw-v5t3_default
    extra_hosts:
      # Required for host.docker.internal on Linux
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mc_data:
    name: mc_wintermute_data

networks:
  openclaw-v5t3_default:
    external: true
