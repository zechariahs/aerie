# /etc/nginx/sites-available/mission-control
#
# Proxies Hostinger external port 60340 → Mission Control :3100
# Enable: ln -s /etc/nginx/sites-available/mission-control /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx

server {
    listen 127.0.0.1:60340;
    server_name your-domain.example.com;

    # SSE stream — must disable buffering or events get batched
    location /api/events {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # WebSocket bridge (Gateway relay)
    location /api/gateway/ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Everything else
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
